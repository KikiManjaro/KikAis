name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          PUB=$(sed -n 's/^version: //p' pubspec.yaml | head -1)
          PUB_SEMVER="${PUB%%+*}"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            TAG_SEMVER="${TAG#v}"
            TAG_SEMVER="${TAG_SEMVER%%+*}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$TAG_SEMVER" >> "$GITHUB_OUTPUT"
            if [ "$TAG_SEMVER" != "$PUB_SEMVER" ]; then
              echo "::warning::Tag version ($TAG_SEMVER) does not match pubspec.yaml version ($PUB_SEMVER). Bump pubspec.yaml so they match for consistency."
            fi
          else
            if [ -z "$PUB_SEMVER" ]; then
              echo "::error::Could not find a version in pubspec.yaml"
              exit 1
            fi
            echo "tag=v$PUB_SEMVER" >> "$GITHUB_OUTPUT"
            echo "version=$PUB_SEMVER" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Build Windows
    needs: version
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package release folder as zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "kikais-windows-${{ needs.version.outputs.version }}.zip"

      - name: Build portable executable
        shell: pwsh
        run: |
          ./scripts/make_portable.ps1 `
            -ReleaseDir "build/windows/x64/runner/Release" `
            -OutputExe "kikais-windows-${{ needs.version.outputs.version }}-portable.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build installer and appcast
        shell: pwsh
        run: |
          ./scripts/make_setup.ps1 `
            -Version "${{ needs.version.outputs.version }}" `
            -ReleaseDir "build/windows/x64/runner/Release" `
            -AppcastDir "build/pages" `
            -DownloadBaseUrl "https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            kikais-windows-*.zip
            kikais-windows-*-portable.exe
            build/installer/kikais-setup-*.exe
            build/pages/

      - name: Deploy appcast and download page to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/pages
          force_orphan: false

  build-linux:
    name: Build Linux
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package bundle as tar.gz
        run: |
          tar -czf "kikais-linux-${{ needs.version.outputs.version }}.tar.gz" -C build/linux/x64/release/bundle .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: kikais-linux-*.tar.gz

  release:
    name: Create GitHub Release
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: KikAis ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: release-assets/**
