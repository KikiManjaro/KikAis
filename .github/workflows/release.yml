name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          PUB=$(sed -n 's/^version: //p' pubspec.yaml | head -1)
          PUB_SEMVER="${PUB%%+*}"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            TAG_SEMVER="${TAG#v}"
            TAG_SEMVER="${TAG_SEMVER%%+*}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$TAG_SEMVER" >> "$GITHUB_OUTPUT"
            if [ "$TAG_SEMVER" != "$PUB_SEMVER" ]; then
              echo "::warning::Tag version ($TAG_SEMVER) does not match pubspec.yaml version ($PUB_SEMVER). Bump pubspec.yaml so they match for consistency."
            fi
          else
            if [ -z "$PUB_SEMVER" ]; then
              echo "::error::Could not find a version in pubspec.yaml"
              exit 1
            fi
            echo "tag=v$PUB_SEMVER" >> "$GITHUB_OUTPUT"
            echo "version=$PUB_SEMVER" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Build Windows
    needs: version
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      HAS_MSIX_CERT: ${{ secrets.MSIX_CERT_B64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package release folder as zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "kikais-windows-${{ needs.version.outputs.version }}.zip"

      - name: Build portable executable
        shell: pwsh
        run: |
          ./scripts/make_portable.ps1 `
            -ReleaseDir "build/windows/x64/runner/Release" `
            -OutputExe "kikais-windows-${{ needs.version.outputs.version }}-portable.exe"

      - name: Build MSIX installer and publish folder
        if: env.HAS_MSIX_CERT == 'true'
        shell: pwsh
        env:
          MSIX_CERT_B64: ${{ secrets.MSIX_CERT_B64 }}
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Path build/msix/publish -Force | Out-Null
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP/msix.pfx",
            [Convert]::FromBase64String($env:MSIX_CERT_B64))
          dart run msix:publish `
            --build-windows false `
            --certificate-path "$env:RUNNER_TEMP/msix.pfx" `
            --certificate-password "$env:MSIX_CERT_PASSWORD" `
            --install-certificate false

          $cert2 = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("$env:RUNNER_TEMP/msix.pfx", $env:MSIX_CERT_PASSWORD)
          $cer = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($cert2.RawData)
          [IO.File]::WriteAllBytes("build/msix/publish/KikAis.cer", $cer.RawData)

      - name: Rewrite appinstaller/index URIs to absolute URLs
        if: env.HAS_MSIX_CERT == 'true'
        shell: pwsh
        run: |
          $base = "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          $app = "build/msix/publish/KikAis.appinstaller"
          $content = Get-Content -Raw -LiteralPath $app
          $content = $content.Replace('build/msix/publish\', $base)
          $content = $content.Replace('build/msix/publish/', $base)
          $content = $content.Replace('\', '/')
          Set-Content -LiteralPath $app -Value $content -NoNewline
          $idx = "build/msix/publish/index.html"
          $html = Get-Content -Raw -LiteralPath $idx
          $html = $html.Replace("'/KikAis.appinstaller'", "'" + $base + "KikAis.appinstaller'")
          Set-Content -LiteralPath $idx -Value $html -NoNewline

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            kikais-windows-*.zip
            kikais-windows-*-portable.exe
            build/msix/KikAis.msix
            build/msix/publish/

      - name: Deploy publish folder to GitHub Pages
        if: env.HAS_MSIX_CERT == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/msix/publish
          force_orphan: false

  build-linux:
    name: Build Linux
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package bundle as tar.gz
        run: |
          tar -czf "kikais-linux-${{ needs.version.outputs.version }}.tar.gz" -C build/linux/x64/release/bundle .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: kikais-linux-*.tar.gz

  release:
    name: Create GitHub Release
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: KikAis ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: release-assets/**
